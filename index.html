<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6C2BD9">
  <title>OSE — Le jeu à 2</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="home" class="screen active">
      <div class="logo">OSE</div>
      <p class="tagline">Le jeu à deux où tu vas devoir...</p>
      <button class="primary" onclick="showSetup()">🔥 OSE-TU ?</button>
      <div class="mini-cards">
        <div>❓<span>Questions</span></div>
        <div>🎯<span>Défis</span></div>
        <div>😏<span>Coquin 18+</span></div>
      </div>
    </section>

    <section id="setup" class="screen">
      <button class="back" onclick="show('home')">←</button>
      <h1>Prêts à jouer ?</h1>
      <p class="sub">Ajoutez de 2 à 8 joueurs.</p>
      <div id="players"></div>
      <button class="add-player" onclick="addPlayer()">＋ Ajouter un joueur</button>
      <button class="primary" onclick="startGame()">C'est parti 🚀</button>
    </section>

    <section id="game" class="screen">
      <div class="topbar">
        <button class="back" onclick="show('home')">✕</button>
        <div class="turn" id="turn"></div>
      </div>
      <div class="wheel-wrap">
        <div class="pointer">▼</div>
        <div class="wheel" id="wheel">
          <div>❓</div><div>🎯</div><div>😏</div><div>❓</div>
          <div>🎯</div><div>😏</div><div>❓</div><div>🎯</div>
        </div>
      </div>
      <div id="result" class="result">
        <div class="result-emoji">🎲</div>
        <h2>À toi de jouer !</h2>
        <p>Choisis une catégorie puis lance la roulette.</p>
      </div>
      <div class="categories">
        <button class="cat question" onclick="play('question')">❓ Question</button>
        <button class="cat action" onclick="play('action')">🎯 Action</button>
        <button class="cat spicy" onclick="play('spicy')">😏 Coquin 18+</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
